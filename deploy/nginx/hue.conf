# Include this file inside nginx's http {} context, e.g. conf.d/hue.conf.
# Replace campus.example.edu, certificate paths and frontend root before use.
# This example assumes nginx, the gateway and the backend share one host.
map $http_upgrade $hue_connection_upgrade {
    default upgrade;
    '' close;
}

upstream hue_gateway {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    server_name campus.example.edu;
    return 308 https://campus.example.edu$request_uri;
}

server {
    listen 443 ssl;
    server_name campus.example.edu;

    ssl_certificate /etc/nginx/tls/hue/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/hue/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/hue/frontend;
    index index.html;
    # Spring's current multipart request limit is 10 MB, including overhead.
    client_max_body_size 10m;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location /api/ {
        # The trailing slash is required:
        # /api/goods -> gateway /goods -> backend /goods
        # /api/ws/chat -> gateway /ws/chat -> backend /ws/chat
        proxy_pass http://hue_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This nginx is the public edge; discard caller-supplied forwarding IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hue_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
